services:
  searxng:
    image: searxng/searxng:latest
    container_name: xiaozhi-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: xiaozhi-local-search-not-exposed-to-public-network

volumes:
  searxng-cache:
