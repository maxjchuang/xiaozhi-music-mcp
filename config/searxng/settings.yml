use_default_settings: true

general:
  instance_name: "Xiaozhi Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "xiaozhi-local-search-not-exposed-to-public-network"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
