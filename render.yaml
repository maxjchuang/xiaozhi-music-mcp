services:
  - type: worker
    name: xiaozhi-music-mcp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 mcp_pipe.py music_mcp_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: MCP_ENDPOINT
        sync: false
    autoDeploy: false
